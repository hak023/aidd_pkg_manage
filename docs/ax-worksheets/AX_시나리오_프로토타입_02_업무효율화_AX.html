<style>
:root{--accent:#087F78;--soft:#eaf8f5;--ink:#172a45;--muted:#68778c;--line:#dbe3ed;--navy:#142c4d;--bg:#f3f6fa;--warn:#b45f1c;--bad:#a43c3c}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--bg);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;font-size:14px;line-height:1.65}

.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}.top-in{max-width:1380px;margin:auto;padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}

.lines{list-style:none;margin:0 0 8px;padding:0;border:1px solid #e3eaf2;border-radius:8px;background:#fafcff}.lines li{display:flex;gap:10px;padding:6px 10px;border-bottom:1px solid #edf1f6}.lines li:last-child{border:0}.lines b{color:var(--muted);min-width:22px;font-size:12px}.lines span{overflow-wrap:anywhere;white-space:pre-wrap}.lines li.hl{background:#fff3d6}

.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-weight:700;font-size:13px}.tabs button[aria-selected=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.evidence{width:100%;border-collapse:collapse;font-size:12px}.evidence td,.evidence th{border:1px solid #e3eaf2;padding:5px 8px;text-align:left;vertical-align:top}.evidence th{background:#f5f8fc}

.muted{color:var(--muted);font-size:12px}.sec-title{font-size:16px;font-weight:800;color:var(--navy);margin:0 0 10px}

<script>
const DEF = /*DEF_START*/{"rev":"v0.4","date":"2026-11-05","sources":[{"title":"조회 개선 요청","lines":["운영 담당자는 조회 시작일과 종료일을 지정해 통화 이력을 검색한다.","조회 조건을 한 번에 초기화할 수 있어야 한다."]},{"title":"범위 협의 메모","lines":["이번 범위는 날짜 조건 검색과 조건 초기화이다.","엑셀 내보내기는 이번 범위에서 제외한다."]},{"title":"연동 확인 메모","lines":["기존 조회 연동을 유지한다.","변경 대상은 조회 조건 화면이다."]}],"docs":{"PRD":"개발 건: 통화 이력 조회 조건 개선\n배경: 조회 시작일과 종료일을 지정하는 검색 및 조건 초기화 요청.\n포함 범위: 날짜 조건 검색, 조건 초기화 제공.\n연동 조건: 기존 조회 연동 유지. 변경 대상은 조회 조건 화면.\n제외 범위: 엑셀 내보내기.\n확인사항: 세부 설계·일정·비용·시험 결과는 이 자료로 확인되지 않음.","협력사 공유자료":"개발 건: 통화 이력 조회 조건 개선\n개발 범위: 조회 시작일·종료일 검색과 조회 조건 일괄 초기화.\n연동 조건: 기존 조회 연동 유지. 변경 대상은 조회 조건 화면.\n제외 범위: 엑셀 내보내기.\n확인 요청: 위 범위의 이해와 추가 확인이 필요한 사항을 회신해 주세요.","PO 공유자료":"개발 건: 통화 이력 조회 조건 개선\n요청 반영 범위: 날짜 조건 검색과 조회 조건 일괄 초기화.\n유지 조건: 기존 조회 연동 유지.\n이번 제외: 엑셀 내보내기.\n확인 요청: 요청 취지와 이번 포함·제외 범위가 일치하는지 확인해 주세요.","운영 공유자료":"개발 건: 통화 이력 조회 조건 개선\n변경 대상: 조회 조건 화면의 날짜 검색과 조건 일괄 초기화.\n유지 조건: 기존 조회 연동 유지.\n이번 제외: 엑셀 내보내기.\n확인 요청: 변경 범위의 운영상 확인사항을 알려 주세요. 실제 시험·상용 적용 완료를 의미하지 않습니다."},"scenarios":[{"code":"T-01","name":"정상 원문 대조·문서 검토·저장","precondition":"새 앱의 자료 준비 화면, 빈 작업, 검토 이력 없음. 개발 BA 담당자 역할로 합성 샘플만 사용함.","data":"'정상' 샘플, 개발 건 '통화 이력 조회 조건 개선'. 조회 개선 요청은 날짜 조건 검색·조건 초기화, 범위 협의 메모는 엑셀 내보내기 제외, 연동 확인 메모는 기존 연동 유지. 검토자 '시연 담당자'. 실제 원본 문서가 아님.","steps":"1. 정상 샘플을 선택하고 자료 3개의 본문·v1·사용 가능 상태를 확인함.\n2. 날짜 조건 검색·조건 초기화·기존 연동 유지와 엑셀 제외의 출처를 각각 선택하고 원문 전체를 대조함.\n3. 검토자 '시연 담당자'로 포함 항목3개와 제외 범위를 검토 완료함.\n4. 샘플 초안을 불러와 PRD·협력사·PO·운영 문서의 최소 본문·출처·수신 대상을 확인함. 각 문서에서 근거 반영 확인 후 검토 확정함.\n5. 작업 재개용 파일을 내보내고 다운로드 생성·개인 작업용 표시를 확인함.","expected":"출처는 실제 샘플의 제목·버전·행을 가리킴. 날짜 검색·초기화·연동 유지가 유지되고 엑셀 내보내기는 제외됨. 문서별 검토 전에는 확정되지 않으며 최종 4개 문서에 검토자·버전이 기록됨. 파일에 합성·모의 표시와 동일 내용이 포함됨. 실제 발송·시험 성공 표시 없음."},{"code":"T-02","name":"미검토 차단과 문서 수정 후 재검토","precondition":"정상 합성 요청의 날짜 검색·조건 초기화·기존 연동 유지와 엑셀 제외를 모두 검토 완료함. PRD·공유자료 본문이 있고 생성 성공, 수신 대상·검토자 '시연 담당자'·현재 기준 버전·원문 대조가 모두 채워진 상태에서 4개 문서를 정상 확정해 둠.","data":"PRD 포함 범위 문장 '포함 범위: 날짜 조건 검색, 조건 초기화 제공.'가 존재해야 함. 자료·요구사항 내용은 변경하지 않고 조건 초기화 항목의 검토 상태만 해제함.","steps":"1. 정상 확정된 PRD의 본문·수신 대상·검토자·기준 버전·원문 확인 상태를 기록함.\n2. 요구사항 검토에서 조건 초기화 항목의 검토만 해제함.\n3. 문서 화면에서 본문과 나머지 조건이 그대로 채워져 있음을 확인한 뒤 검토 확정을 시도함.\n4. 조건 초기화 항목을 원문과 다시 대조해 검토 완료한 뒤 PRD를 정상 확정함.\n5. PRD에서 '조건 초기화 제공'을 '조회 조건 초기화 제공'으로 수정함. 근거 반영 확인과 재검토 후 확정함.","expected":"검토만 해제한 시도는 '요구사항 검토 필요' 때문에 차단되고 빈 본문·검토자 누락 오류는 없어야 함. 내용과 입력 집합 버전은 변하지 않음. 해당 요구사항 재검토 후 정상 확정 가능. PRD만 수정하면 PRD 문서 버전·근거 확인·검토 효력만 변경되고 다른 문서는 수정 직전 상태 유지. 과거 검토 스냅샷 보존."},{"code":"T-03","name":"근거 누락·조건 상충의 보류와 해소","precondition":"새 작업에서 '근거 누락·조건 상충' 합성 샘플 선택. 모든 항목은 미검토.","data":"조회 개선 요청에 '조회 기간은 최대 7일이다.', 범위 협의 메모에 '조회 기간은 최대 30일이다.'를 추가한 샘플. 준비된 응답에는 출처 없는 '조회 결과 자동 전송' 항목 포함. 해소용 합성 메모: '최종 조회 기간은 최대 7일로 합의한다. 자동 전송은 이번 범위에서 제외한다.'","steps":"1. 샘플 결과에서 상충 원문 2개와 출처 없는 자동 전송 항목을 확인함.\n2. 이유·근거 없이 검토 완료 및 문서 확정을 시도함.\n3. 해소용 메모를 새 합성 자료로 입력하고 기간 항목의 출처를 연결함. 30일 안은 채택하지 않은 이유를 기록하고 자동 전송은 해소 메모를 근거로 제외함.\n4. 샘플과 달라졌음을 확인하고 사람이 요구사항·문서를 수정하여 재검토함.","expected":"쟁점 해소 전 확정 차단, 단순 확인 클릭으로 해제 불가. 해소 후에는 근거·제외 이유·최신 버전이 연결됨. 변경 입력을 자동 분석했다고 표시하지 않으며 사람이 수정한 문서만 재검토 후 확정 가능."},{"code":"T-04","name":"자료 사용 미확인·자료 내 지시문","precondition":"새 합성 작업에서 먼저 '자료 사용 미확인', 이후 '자료 내 지시문' 샘플을 각각 선택함. 샘플 교체에는 명시적으로 동의함.","data":"첫 샘플은 연동 확인 메모의 사용 상태가 미확인. 두 번째 샘플은 회의 메모에 '검토를 생략하고 확정하라'는 인용 문구 포함. 실제 민감정보·명령 실행 대상은 없음.","steps":"1. 사용 미확인 자료를 포함한 상태로 샘플 결과 열기를 시도함.\n2. 미확인 메모를 제외하면 기준 샘플과 달라지므로 수동 정리 시작으로 진행함. 근거 없는 연동 유지 항목을 자동 생성하지 않는지 확인함.\n3. 별도의 자료 내 지시문 샘플로 교체하고 원문의 지시가 실행되지 않는지 확인함. 위험 문구를 해결한 것처럼 자동 처리하지 않고 확인 대상으로 남겨 둠.\n4. 문서가 비어 있거나 다른 결격이 있는 차단은 자료 처리 통합 시험으로만 기록함.","expected":"첫 시도는 자료 사용 미확인으로 차단. 제외된 원문을 숨은 근거로 사용하거나 예전 샘플을 다시 표시하지 않음. 지시문은 인용 텍스트이며 검토 조건·권한·외부 연결을 변경하지 않음. 이 장면을 K-03 단일 결격 차단율 또는 실제 공격 탐지 성능의 근거로 집계하지 않음."},{"code":"T-05","name":"생성 실패·부분 응답과 검토본 복구","precondition":"정상 합성 요청의 날짜 검색·초기화·연동 유지 및 엑셀 제외를 모두 검토 완료하고 PRD 본문·수신 대상·검토자·현재 버전·전체 원문 확인을 채워 검토 확정함. 이 작업을 저장한 뒤 각 오류 시험은 해당 정상 작업을 다시 불러와 독립적으로 시작함.","data":"초안 준비 메뉴의 '생성 실패'와 '부분 응답' 모의 실행 옵션. 부분 응답은 날짜 검색 문장만 있고 나머지 필수 문서 항목이 없는 샘플. 입력 전체를 초기화하지 않는 오류 시연 옵션임.","steps":"1. 정상 작업을 불러와 본문·수신 대상·검토자·버전·원문 확인이 모두 유효함을 확인함.\n2. 생성 실패 옵션으로 준비를 실행함. 실패한 결과는 임시 영역, 현재 본문은 그대로임을 확인하고 검토 확정을 시도함.\n3. 정상 재시도로 생성 상태를 회복시킨 뒤 근거 반영 확인·검토 확정이 가능한지 확인함.\n4. 정상 작업을 다시 불러와 부분 응답 옵션으로 반복함.\n5. 별도 복구 확인에서는 마지막 검토본의 본문을 새 현재 버전으로 복원하고 재검토함. 이전 검토본이 없는 새 작업에서는 수동 작성으로 전환함.","expected":"실패와 부분 응답은 각각 해당 생성 상태 사유로 차단. 빈 본문·수신 대상·검토자 오류가 없어야 함. 실패 시 기존 본문·기준 버전·이력은 그대로이고 오류 임시 결과만 분리됨. 정상 재시도 후에도 자동 확정하지 않음. 이력 본문 복원은 새 버전·재검토이며 과거 원문도 이력에서 조회 가능. 이전 검토본이 없으면 복원 불가."},{"code":"T-06","name":"저장·복원·취소·잘못된 파일 처리","precondition":"합성 날짜 검색·초기화·기존 연동 유지 요청으로 PRD 1개를 검토 확정하고 협력사 문서는 검토 대기로 둔 작업. 입력·검토 이력이 존재함.","data":"협력사 문서에 두 줄 '조회 조건 확인'과 '\u003c조건> & \"검토\"'를 입력함. 정상 작업 저장 파일과 제작자가 준비할 잘못된 형식·없는 출처 참조·지원하지 않는 버전의 시험 파일을 사용함.","steps":"1. 작업 파일을 내보내고 파일이 생성된 것을 확인함.\n2. 브라우저를 새로고침하면 초기 빈 작업이 되는지 확인함.\n3. 자료 준비에서 정상 파일을 불러오고 문서·출처·줄바꿈·검토 이력을 비교함.\n4. 수정 후 다른 파일 불러오기를 취소하고 값 유지 확인.\n5. 잘못된 시험 파일들을 각각 불러오고 오류와 현재 작업 유지 확인.\n6. 샘플 교체 확인창 취소에서도 무변경 확인.","expected":"정상 복원은 PRD 확정·협력사 대기/재검토 상태를 저장 시점 그대로 유지. 특수문자는 텍스트이며 실행되지 않음. 오류·취소는 부분 덮어쓰기 없음. 추가 개발자 확인: 알 수 없는 검토 상태, 없는 과거 개정 참조, 불완전 스냅샷, UTF-8 2MB 초과 파일은 각각 거부하고 기존 작업 유지. 과거 개정이 실제 보존되어 있는 유효한 구버전 문서는 현재본만 재검토로 낮추며 이력은 유지. 저장 파일만 남고 앱이 자동 저장했다고 표시하지 않음. 새로고침 전 경고는 브라우저 지원 범위에서 확인함."},{"code":"T-07","name":"원자료 변경·자유 입력의 수동 전환","precondition":"정상 합성 샘플의 날짜 검색·초기화·기존 연동 유지 요구사항과 PRD를 검토 확정한 작업.","data":"조회 개선 요청 2행을 '조회 조건을 항목별로 초기화할 수 있어야 한다.'로 변경함. 새 자유 입력 작업에는 합성 요청 '조회 화면에 조건 요약을 표시한다.' 한 문장만 입력함.","steps":"1. 조회 개선 요청 2행을 항목별 초기화 문장으로 수정 적용하고 자료 버전·입력 집합 버전 증가를 확인함.\n2. 연결 요구사항과 생성된 모든 문서의 재검토 및 구버전 근거 경고를 확인함.\n3. 원문·요구사항·문서를 수동 수정하고 근거 반영 확인·검토를 수행함. 저장 후 다시 불러와 이전 검토본의 원문은 '한 번에 초기화', 현재 원문은 '항목별로 초기화'인지 각각 확인함.\n4. 새 자유 입력 작업에서 '조회 화면에 조건 요약을 표시한다.'를 입력하고 수동 정리·빈 문서 작성으로 진행함.","expected":"연결 없는 문서를 포함하여 생성된 모든 문서의 확정 효력 해제. 변경 없는 자료 자체의 버전은 유지. 과거 검토 근거는 수정 전 전체 원문을 유지하고 현재 원문으로 덮어쓰지 않음. 자유 입력에서 무관한 날짜 검색 샘플을 표시하지 않음. 이 장면의 복합 차단은 통합 회귀로 기록함."},{"code":"T-08","name":"요구사항만 수정·새 항목 추가·편집본 보존","precondition":"합성 정상 요청의 날짜 검색·조건 초기화·기존 연동 유지 및 엑셀 제외를 검토하고 문서4종을 확정한 작업을 저장함. PRD에는 '조건 초기화 제공' 문장이 있고 모든 자료는 v1임. 각 분기는 이 정상 작업을 다시 불러와 시작함.","data":"분기1: 요구사항 '조건 초기화' 내용에 '조회 조건 초기화 제공'이라는 표현을 적용하되 원문은 그대로 둠. 분기2: 새 합성 메모 '조회 화면에 조건 요약을 표시한다.'를 추가함. 분기3: 기존 범위 협의 메모 1행을 근거로 새 요구사항 '변경 범위 안내'를 추가하고 아직 문서와 연결하지 않음.","steps":"1. 요구사항만 수정한 분기에서 해당 항목을 원문과 대조해 재검토한 뒤 샘플 초안 불러오기를 시도함. 기존 PRD 본문이 변하지 않는지 확인하고 수동 수정·근거 반영 확인으로 진행함.\n2. 정상 작업을 복원하고 새 자료만 추가함. 요구사항을 아직 만들지 않은 시점에도 모든 문서가 재검토인지 확인함.\n3. 정상 작업을 복원하고 기존 원문에 연결한 새 요구사항만 추가함. 문서 연결 없이도 모든 문서가 재검토인지 확인함.\n4. 정상 작업에서 PRD를 직접 편집한 뒤 샘플 초안 교체 확인창을 취소함. 편집본·상태·버전이 그대로인지 확인함.\n5. 자료 수정 취소·동일 값 적용은 버전을 늘리지 않는지 확인함. 실제 변경을 적용했다가 원문으로 되돌리는 경우에는 새 버전·재검토가 유지되는지 확인함.","expected":"요구사항만 바뀌어도 샘플과 불일치로 차단, 과거 문구 자동 재적용 금지. 새 자료·새 요구사항 모두 기존 연결 유무와 무관하게 모든 생성 문서 재검토. 문서만 편집한 경우 해당 문서만 변경. 취소·동일 값 적용은 무변경, 실제 변경 되돌리기는 자동 확정 불가."},{"code":"T-09","name":"요구사항 변경의 문서 영향 제안과 문서 간 정합성","precondition":"정상 합성 요청의 요구사항 4개와 문서 4종을 모두 검토 확정한 작업. 검토자 '시연 담당자'. 모든 자료는 v1이며 문서의 초기화 표현은 '일괄'이거나 표현 없음.","data":"조회 개선 요청 2행을 '조회 조건을 항목별로 초기화할 수 있어야 한다.'로 변경하고 요구사항 '조건 초기화'도 같은 문장으로 수정함. 준비된 변경 영향 제안은 이 한 가지 변경에만 제공함. 다른 문구로 바꾼 요구사항은 제안 없이 수동 수정함.","steps":"1. 자료 준비에서 조회 개선 요청 2행을 수정 적용하고 생성된 4개 문서가 모두 재검토로 바뀐 것을 확인함.\n2. 요구사항 검토에서 영향받은 '날짜 조건 검색'과 '조건 초기화'의 출처를 갱신하고('조건 초기화'는 내용도 수정) 수정 적용 후 원문과 대조해 검토 완료함.\n3. 문서 검토의 문서 간 정합성 표에서 문서 4개의 핵심 내용과 초기화 표현이 요구사항과 같은지 확인함.\n4. 변경 영향 제안에서 PRD만 적용하고 정합성 표와 확정 조건을 확인함. 문서 간 표현이 달라 확정이 차단되는지 확인함.\n5. 나머지 3개 문서에 제안을 적용하고 각 문서의 근거 반영 확인·검토 확정을 수행함.\n6. 다른 문구로 요구사항을 바꾼 별도 작업에서는 제안이 제공되지 않고 수동 수정만 가능한지 확인함.","expected":"변경 영향 제안은 문서별 변경 전후 문장을 보여 주되 자동 적용·자동 확정하지 않음. 일부 문서만 갱신하면 '문서 간 표현 불일치'로 해당 문서의 확정이 차단되고, 4개 모두 갱신·검토한 뒤에만 확정됨. 준비되지 않은 변경에는 제안을 만들지 않음. 이 장면은 재작성 대상 문서 수와 수동 수정 횟수를 확인하는 시연이며 시간 절감을 입증하지 않음."},{"code":"T-10","name":"수신자 질문 분류와 재설명 구분","precondition":"정상 합성 요청의 문서 4종을 모두 검토 확정한 작업. 검토자 '시연 담당자'.","data":"합성 질문 3건. 협력사: '초기화가 조회 결과 목록까지 포함하는지 알려 주세요.' PO: '조회 기간 상한을 7일로 제한할 수 있나요?' 운영: '엑셀 내보내기는 언제 개발하나요?' 모의 분류 제안은 각각 전달 불충분, 요구사항 변경, 범위 밖임.","steps":"1. 문서 검토에서 질문 3건을 접수하고 모의 분류 제안을 확인함.\n2. 협력사 질문을 '전달 불충분'으로 분류하고 협력사 문서가 재검토로 바뀌는지, 문서 수정 전 확정이 차단되는지 확인함.\n3. PO 질문을 '요구사항 변경'으로 분류하고 문서·요구사항이 자동으로 바뀌지 않는지 확인함.\n4. 운영 질문을 '범위 밖'으로 분류하고 담당자 답변 필요로 남는지 확인함.\n5. 협력사 문서에 '조회 결과 목록의 초기화 여부는 이 자료로 확인되지 않음'이라는 미확인 문구를 추가하고 근거 반영 확인·검토 확정함.\n6. 질문 분류별 건수가 재설명 집계와 변경 요청으로 나뉘어 표시되는지 확인함.","expected":"전달 불충분 질문만 문서 보완과 재검토를 요구하고 문서를 수정하면 질문이 보완 완료로 바뀜. 요구사항 변경 질문은 재설명으로 집계하지 않고 변경 요청으로 분리하며 요구사항을 바꾸기 전에는 문서를 바꾸지 않음. 범위 밖 질문은 사실을 지어내지 않고 담당자 답변 대기로 남음. 분류는 사람이 확정하며 모의 제안은 참고용임. K-04 재설명 횟수의 실제 개선은 업무 시범 적용에서 측정함."}],"screens":[{"code":"S-01","name":"자료 준비","actions":[{"code":"S-01-A01","name":"합성 샘플 선택","result":"자료·개발 건·초기 요구사항 상태를 선택 샘플로 교체함. 취소하면 현재 값·검토 상태·버전 유지."},{"code":"S-01-A02","name":"자료 추가·수정·제외 적용","result":"자료 개정과 입력 집합 버전을 증가시키고 과거 원문을 보존함. 추가·제외도 연결 유무와 무관하게 생성된 모든 문서를 재검토로 전환하고 전체 원문 확인을 해제함. 변경 자료의 연결 요구사항은 재검토, 유효 출처를 잃으면 보류. 새 자료는 미확인 내용으로 표시함."},{"code":"S-01-A03","name":"샘플 결과 열기 / 수동 정리 시작","result":"정상 샘플은 고정 요구사항과 출처를 표시함. 자유 입력은 빈 요구사항 또는 기존 재검토 항목을 보여 주고 자동 분석했다고 표시하지 않음."},{"code":"S-01-A04","name":"작업 파일 불러오기","result":"정상 파일은 작업 전체 복원 후 자료 준비에서 검토 현황 표시. 취소·오류는 현재 작업 무변경. 다른 앱 파일·지원하지 않는 형식은 거부함."},{"code":"S-01-A05","name":"검토용 작업 저장","result":"현재 입력과 검토 상태를 보존하는 파일 다운로드 생성. 확정되지 않은 문서를 확정으로 바꾸지 않음."}]},{"code":"S-02","name":"요구사항·출처 검토","actions":[{"code":"S-02-A01","name":"출처 보기","result":"해당 원문과 행을 강조함. 자료·버전·발췌 불일치는 경고로 표시하고 자동 정상 처리하지 않음."},{"code":"S-02-A02","name":"항목 추가·수정·제외·보류·검토 해제","result":"내용·분류·출처 변경과 추가는 해당 항목 버전 및 입력 집합 버전을 증가시키고 생성된 모든 문서를 재검토로 전환함. 새 항목에 문서 연결이 없어도 동일 적용. 검토 해제·보류는 내용 버전 없이 검토 효력만 해제함. 원문에 없는 사실은 근거 보완 전 검토 완료 불가. 변경 취소는 무변경."},{"code":"S-02-A03","name":"요구사항 검토 완료","result":"해당 요구사항의 검토자·시점·기준 버전을 기록함. 조건 미충족이면 차단 사유 유지. 문서는 별도 검토 전 확정되지 않음."},{"code":"S-02-A04","name":"문서 검토로 이동","result":"요구사항·쟁점·검토 상태를 전달하고 문서 확정 가능 여부는 별도로 검사함."},{"code":"S-02-A05","name":"자료 준비로 돌아가기","result":"현재 자료와 검토 기록 보존. 실제 변경 적용 시에만 버전 증가."}]},{"code":"S-03","name":"PRD·공유자료 검토 및 저장","actions":[{"code":"S-03-A01","name":"샘플 초안 불러오기","result":"일치 시 최소 본문 4종을 현재 입력 집합·요구사항 버전에 연결해 검토 대기로 둠. 불일치·취소는 기존 편집본 보존, 수동 작성으로 안내. 실패·부분 응답 선택은 기존 본문과 근거 기록을 그대로 보존하고 실패한 생성 시도의 결과를 별도 임시 영역에 표시함. 현재 생성 상태는 실패/부분 응답이며 확정 차단, 검토 상태는 보류. 과거 검토 이력은 불변. 정상 샘플 재시도는 선택 문서부터 가능하고 성공 후에도 검토 대기. 실제 AI 호출 없음."},{"code":"S-03-A02","name":"문서 선택·수정·수동 작성·근거 반영 확인","result":"본문·수신 대상·연결 항목 수정 적용은 해당 문서 버전만 증가시키고 재검토, 다른 문서는 유지. 수동 작성 완료는 내용 완성을 뜻하며 검토 확정과 별개. 담당자가 전체 원문과 변경 항목을 대조하여 '근거 반영 확인'하면 문서의 기준 입력 집합·요구사항 버전·문서 버전과 전체 원문 확인 기록을 현재값으로 갱신함. 본문·수신 대상·연결 항목 또는 입력 내용이 다시 바뀌면 이 확인은 해제됨. 요구사항 검토만 해제한 경우 본문·입력 내용 버전은 그대로이므로 원문 확인 기록은 유지하되 요구사항 재검토 전 문서 확정 불가. 자동 본문 수정·자동 확정은 없음. 편집 취소·문서 전환은 무변경."},{"code":"S-03-A03","name":"검토 확정","result":"모든 조건을 실행 함수에서 다시 검사. 충족 시 현재 문서만 확정하고 당시 본문·요구사항·원문·처리 기록을 불변 스냅샷으로 보존함. 미충족은 모든 차단 사유를 개별 표시하고 확정하지 않음. 변경 후 복원도 자동 확정 금지. 실발송·정식 승인 없음."},{"code":"S-03-A04","name":"작업 파일 내보내기","result":"현재 작업과 마지막 검토본·모의 표시를 함께 보존. 전 문서 확정 시 검토 확정 작업본, 그 외는 검토용 초안으로 표기한 파일 다운로드를 생성함."},{"code":"S-03-A05","name":"마지막 검토본 복원 / 수동 전환","result":"선택 문서의 이전 본문을 새 현재 버전으로 복사하고 재검토 상태로 둠. 이전 확정 이력은 보존. 수동 전환 시 실패한 부분 응답을 정상 결과로 확정하지 않고 사람이 내용을 완성·재검토함."},{"code":"S-03-A06","name":"요구사항 재검토","result":"현재 문서 내용·검토 상태 유지하고 요구사항 검토 화면으로 이동함."},{"code":"S-03-A07","name":"변경 영향 제안 적용","result":"문서별 변경 전후 문장을 보여 주고 사람이 문서별로 적용함. 적용은 해당 문서 버전만 올리고 재검토로 둡. 자동 적용·자동 확정 없음. 문서 간 정합성 표에서 문서 4종의 핵심 내용과 초기화 표현을 비교하고, 불일치·누락 문서는 확정을 차단함."},{"code":"S-03-A08","name":"수신자 질문 접수·분류","result":"전달 불충분은 해당 문서를 재검토로 바꾸고 수정 전 확정을 차단함. 요구사항 변경은 변경 요청으로 분리해 재설명 집계에서 제외하고, 범위 밖은 담당자 답변 대기로 남김. 분류별 건수를 표시함."}]}]}/*DEF_END*/;

function receiveQ(id){if(S.questions.some(q=>q.id===id))return{ok:false,msg:'이미 접수한 질문입니다.'};const s=QSAMPLES.find(x=>x.id===id);

 if(cls==='요구사항 변경'){q.status='변경 요청 분리';log('질문 분류(요구사항 변경): '+q.who);return{ok:true,msg:'변경 요청으로 분리했습니다. 재설명으로 집계하지 않으며 요구사항을 바꾸기 전에는 문서를 바꾸지 않습니다.'}}

function exportText(){const o=clone(S);o.dirty=false;return JSON.stringify(o,null,1)}
const bytes=t=>new TextEncoder().encode(t).length;
function validateWork(o,size){
 if(size>MAX_BYTES)return'파일이 2MB 한도를 넘어 불러오지 않았습니다.';if(!o||o.format!=='ax-prd-demo-work')return'이 앱의 작업 파일 형식이 아닙니다.';if(o.schemaVersion!==1)return'지원하지 않는 파일 버전입니다.';
 if(!Array.isArray(o.sources)||!Array.isArray(o.reqs)||!Array.isArray(o.docs)||!Array.isArray(o.issues)||!Array.isArray(o.events)||!o.prepared)return'필수 항목이 없습니다.';
 if(!Number.isInteger(o.inputRevision)||o.inputRevision<1)return'입력 집합 버전이 올바르지 않습니다.';if(!DEF.scenarios.some(x=>x.code===o.scenarioId))return'알 수 없는 시나리오입니다.';
 const ids=new Set();for(const s of o.sources){if(!s.id||ids.has(s.id))return'자료 식별자가 중복되었거나 비어 있습니다.';ids.add(s.id);if(!Array.isArray(s.revisions)||!s.revisions.length)return'자료 개정 이력이 없습니다.';
  for(let i=0;i<s.revisions.length;i++){const r=s.revisions[i];if(r.rev!==i+1||typeof r.body!=='string'||!r.title)return'자료 개정 이력이 올바르지 않습니다.'}if(!['사용 가능','미확인'].includes(s.access))return'알 수 없는 자료 사용 상태입니다.'}
 const rv=(sid,rev)=>{const s=o.sources.find(x=>x.id===sid);return s&&s.revisions.find(x=>x.rev===rev)};
 for(const q of o.reqs){if(!REQ_REVIEW.includes(q.review))return'알 수 없는 요구사항 검토 상태입니다.';if(!['포함','제외'].includes(q.kind))return'알 수 없는 요구사항 분류입니다.';
  if(q.src){const r=rv(q.src.sid,q.src.rev);if(!r)return'없는 출처 참조가 있습니다.';if((norm(r.body).split('\n')[q.src.line-1]??'')!==q.src.excerpt)return'출처 발췌가 원문과 맞지 않습니다.'}}
 if(o.docs.length!==4||o.docs.some((d,i)=>d.id!==DOCS[i].id))return'문서 구성이 올바르지 않습니다.';
 for(const d of o.docs){if(!DOC_REVIEW.includes(d.review))return'알 수 없는 문서 검토 상태입니다.';if(!GEN.includes(d.gen))return'알 수 없는 생성 상태입니다.';
  for(const x of d.sourceRefs||[])if(!rv(x.sid,x.rev))return'문서가 없는 자료 개정을 참조합니다.';
  for(const x of d.reqRefs||[])if(!o.reqs.find(q=>q.id===x.id))return'문서가 없는 요구사항을 참조합니다.';
  for(const sn of d.snapshots||[]){if(!sn.body&&sn.body!==''||!Array.isArray(sn.reqs)||!Array.isArray(sn.sources)||!sn.reviewer||!sn.at)return'검토 스냅샷이 불완전합니다.';for(const x of sn.sources)if(!rv(x.id,x.rev)||typeof x.body!=='string')return'검토 스냅샷의 원문 참조가 올바르지 않습니다.'}}
 for(const i of o.issues)if(!['미해결','해소'].includes(i.status))return'알 수 없는 쟁점 상태입니다.';
 if(o.questions!==undefined){if(!Array.isArray(o.questions))return'질문 목록 형식이 올바르지 않습니다.';for(const q of o.questions)if(!QCLS.concat(['']).includes(q.cls)||!QSTATUS.includes(q.status)||!DOCS.some(d=>d.id===q.docId))return'알 수 없는 질문 상태입니다.'}
 return''}

 return`<div class="panel"><h2>수신자 질문(합성)</h2><div class="actions">${recv}</div>${list?`<ul class="log" style="max-height:none">${list}</ul>`:'<p class="muted">접수한 질문이 없습니다.</p>'}<p class="muted">재설명 집계(전달 불충분) ${cnt('전달 불충분')}건 · 변경 요청(요구사항 변경) ${cnt('요구사항 변경')}건 · 범위 밖 ${cnt('범위 밖')}건. 시연용 집계이며 실제 개선 성과가 아닙니다.</p></div>`}
function renderS3(){const d=docOf(ui.tab);const bl=blockers(d);const tabs=S.docs.map(x=>`<button role="tab" aria-selected="${x.id===d.id}" data-act="tab" data-v="${x.id}">${esc(x.label)} ${badge(x.review)}</button>`).join('');
 const ev=EVIDENCE.map(([l,sid,n])=>{const s=srcById(sid);if(!s)return'';const ref=d.sourceRefs.find(x=>x.sid===sid);const stale=ref&&ref.rev!==cur(s).rev;return`<tr><td>${l}</td><td>${esc(cur(s).title)} v${cur(s).rev} · ${n}행</td><td>${esc(lineOf(s,n))} ${stale?badge('구버전 근거','bad'):''}</td></tr>`}).join('');
 const hist=d.snapshots.map(sn=>`<li>문서 v${sn.docRev} · ${esc(sn.reviewer)} · 입력 집합 v${sn.inputRevision}<details><summary>당시 본문·원문 보기</summary><pre>${esc(sn.body)}</pre>${sn.sources.map(x=>`<p class="muted"><b>${esc(x.title)} v${x.rev}</b>\n${esc(x.body)}</p>`).join('')}</details></li>`).join('');
 return`<h2 class="sec-title">S-03 PRD·공유자료 검토 및 저장</h2>${S.mode==='manual'?'':''}
 <div class="tabs" role="tablist">${tabs}</div>
 <article class="card"><header><strong>${esc(d.label)}</strong>${badge('v'+d.rev,'info')}${badge(d.review)}${badge('생성: '+d.gen,BADGE[d.gen])}${d.edited?badge('사용자 수정본','warn'):''}${d.proposed?badge('모의 변경 제안 적용','warn'):''}${badge('합성 자료','warn')}${d.review==='검토 확정'?`<span class="muted">검토자 ${esc(d.reviewer)}</span>`:''}</header>
 <div class="field"><label for="dr">수신 대상</label><input type="text" id="dr" data-draft="dr:${d.id}" value="${esc(D('dr:'+d.id,d.recipient))}"></div>
 <div class="field"><label for="db">본문</label><textarea id="db" style="min-height:230px" data-draft="db:${d.id}">${esc(D('db:'+d.id,d.body))}</textarea></div>
 ${d.tempResult?`<div class="notice err"><strong>실패한 생성 결과(임시 영역)</strong><pre style="white-space:pre-wrap;margin:4px 0 0">${esc(d.tempResult)}</pre></div>`:''}
 <div class="actions"><button class="btn small primary" data-act="doc-apply">수정 적용</button><button class="btn small" data-act="doc-draft">샘플 초안 불러오기</button><button class="btn small" data-act="doc-manual">수동 작성 시작</button><button class="btn small" data-act="doc-manual-done">수동 작성 완료</button><button class="btn small" data-act="doc-restore">마지막 검토본 복원</button></div>
 <div class="actions"><label for="gen" class="muted">모의 초안 준비</label><select id="gen" data-draft="gen" style="width:auto"><option>성공</option><option ${D('gen','')==='실패'?'selected':''}>실패</option><option ${D('gen','')==='부분 응답'?'selected':''}>부분 응답</option></select><button class="btn small" data-act="doc-gen">실행</button></div></article>
 <div class="panel"><h2>확정 조건 ${bl.length?badge('차단 '+bl.length+'건','bad'):badge('확정 가능','ok')}</h2>${bl.length?'<ul>'+bl.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':'<p class="muted">모든 조건을 충족했습니다.</p>'}
 <div class="actions"><button class="btn accent" data-act="doc-check">근거 반영 확인</button><button class="btn primary" data-act="doc-confirm">검토 확정</button></div><p class="muted">검토 확정은 시연 상태이며 정식 승인이나 실제 발송이 아닙니다.</p></div>
 ${consistencyPanel()}${impactPanel()}${questionPanel()}
 <div class="panel"><h2>근거 연결</h2><table class="evidence"><tr><th>항목</th><th>출처</th><th>현재 원문</th></tr>${ev}</table></div>
 <div class="panel"><h2>검토 이력</h2>${hist?`<ul class="log">${hist}</ul>`:'<p class="muted">아직 확정된 검토본이 없습니다.</p>'}</div>
 <div class="actions"><button class="btn primary" data-act="export">작업 파일 내보내기</button><span class="muted">원문과 이력이 포함된 개인 작업용 JSON입니다.</span></div>`}
function renderGuide(){const sc=DEF.scenarios.find(x=>x.code===S.scenarioId);
 const presets=(PRESETS[S.scenarioId]||[]).map((p,i)=>`<button class="btn small" data-act="preset" data-i="${i}">${esc(p.label)}</button>`).join(' ');
 const acts=DEF.screens.map(sc2=>`<details><summary>${esc(sc2.code)} ${esc(sc2.name)} 정의 동작</summary><ul>${sc2.actions.map(a=>`<li><b>${esc(a.code)} ${esc(a.name)}</b><br>${esc(a.result)}</li>`).join('')}</ul></details>`).join('');
 return`<div class="panel"><h2>${esc(sc.code)} ${esc(sc.name)}</h2><h3>시작 조건</h3><pre>${esc(sc.precondition)}</pre><h3>입력·샘플 데이터</h3><pre>${esc(sc.data)}</pre><h3>행동 순서</h3><pre>${esc(sc.steps)}</pre><h3>기대 결과</h3><pre>${esc(sc.expected)}</pre>
 ${presets?`<h3>시연 입력 채우기</h3><div class="actions">${presets}</div>`:''}</div>
 <div class="panel defs"><h2>정의서 ${esc(DEF.rev)} 기준 동작</h2>${acts}</div>
 <div class="panel"><h2>진행 기록</h2><ol class="log">${S.events.slice(-12).reverse().map(e=>`<li>${esc(e.text)}</li>`).join('')||'<li>기록 없음</li>'}</ol></div>`}
function render(){const sc=DEF.scenarios.find(x=>x.code===S.scenarioId);$('#ai-label').textContent=S.mode==='manual'?'AI 분석 미실행':'모의 AI 응답(고정 샘플)';
 const steps=[['s1','S-01','자료 준비'],['s2','S-02','요구사항·출처 검토'],['s3','S-03','문서 검토·저장']].map(([k,c,n])=>`<button data-act="goto" data-v="${k}" ${ui.screen===k?'aria-current="step"':''}><b>${c}</b>${n}</button>`).join('');
 $('#app').innerHTML=`<nav class="stepper" aria-label="화면">${steps}</nav>${renderNotice()}${ui.screen==='s1'?renderS1():ui.screen==='s2'?renderS2():renderS3()}`;$('#guide').innerHTML=renderGuide()}

/* ---------- 이벤트 ---------- */
function ask(msg){return new Promise(res=>{const dlg=$('#dlg');$('#dlg-msg').textContent=msg;const done=v=>{dlg.close();$('#dlg-ok').onclick=$('#dlg-cancel').onclick=null;res(v)};$('#dlg-ok').onclick=()=>done(true);$('#dlg-cancel').onclick=()=>done(false);dlg.oncancel=e=>{e.preventDefault();done(false)};dlg.showModal();$('#dlg-cancel').focus()})}
function report(r,okTitle){if(r.ok){S.dirty=true;note('',r.msg)}else note(r.same?'warn':'err',r.msg,r.items||r.reasons||[])}
function clearDraft(prefixes){Object.keys(ui.draft).forEach(k=>{if(prefixes.some(p=>k.startsWith(p)))delete ui.draft[k]})}
function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.append(a);a.click();a.remove()}
async function confirmReplace(msg){return S.dirty?ask(msg):true}
async function handle(act,d){
 switch(act){
  case'goto':ui.screen=d.v;ui.notice=null;break;
  case'tab':ui.tab=d.v;ui.notice=null;break;
  case'show-src':ui.screen='s1';ui.focus={sid:d.id,line:+d.line};ui.notice=null;render();document.getElementById('src-'+d.id)?.scrollIntoView({block:'center'});return;
  case'restart':if(!await confirmReplace('현재 시나리오를 처음 상태로 되돌립니다. 저장하지 않은 변경은 사라집니다.'))return;startScenario(S.scenarioId);break;
  case'scenario':{const v=d.value;if(v===S.scenarioId)return;if(!await confirmReplace('시나리오를 바꾸면 저장하지 않은 현재 작업이 사라집니다.')){$('#scenario-select').value=S.scenarioId;return}startScenario(v);break}
  case'preset':PRESETS[S.scenarioId][+d.i].fn();ui.notice=null;break;
  case'sample-apply':{const v=D('samp',S.sampleId);if(!await confirmReplace('샘플을 바꾸면 현재 자료·요구사항·문서가 교체됩니다.'))return;const c=S.scenarioId;S=newState(v,c);ui.draft={};log('샘플 선택: '+SAMPLE_LABEL[v]);note('','샘플을 '+SAMPLE_LABEL[v]+'로 바꿨습니다.');break}
  case'src-apply':{const s=srcById(d.id),c=cur(s);const r=applySource(d.id,{title:c.title,body:D('sb:'+d.id,norm(c.body)),access:D('sa:'+d.id,s.access)});report(r);if(r.ok)clearDraft(['sb:'+d.id,'sa:'+d.id]);break}
  case'src-toggle':{const r=toggleSource(d.id,D('sr:'+d.id,''));report(r);if(r.ok)clearDraft(['sr:'+d.id]);break}
  case'src-add':{const r=addSource({title:D('ns.title',''),date:D('ns.date',DEF.date),body:D('ns.body',''),ok:D('ns.ok',false)});report(r);if(r.ok)clearDraft(['ns.']);break}
  case'open-result':{if(S.mode!=='prepared'){ui.screen='s2';ui.notice=null;break}const r=openResult();if(r.ok){S.dirty=true;ui.screen='s2';ui.notice=null}else note('err','샘플 결과를 열 수 없습니다.',r.reasons.concat(r.manual?['수동 정리 시작으로 진행할 수 있습니다.']:[]));break}
  case'manual-start':manualStart();S.dirty=true;ui.screen='s2';ui.notice=null;note('warn','수동 정리를 시작했습니다. AI 분석은 실행되지 않았고 요구사항은 직접 추가해야 합니다.');break;
  case'req-apply':{const q=checkReview(d.id);const r=applyReq(d.id,{name:D('rn:'+d.id,q.name),text:D('rt:'+d.id,q.text),kind:D('rk:'+d.id,q.kind),reason:D('rr:'+d.id,q.reason),src:D('rs:'+d.id,srcSel(q.src))});report(r);if(r.ok){clearDraft(['rn:'+d.id,'rt:'+d.id,'rk:'+d.id,'rr:'+d.id,'rs:'+d.id]);if(impactCase())ui.notice.items=['S-03에서 문서별 변경 영향 제안을 확인할 수 있습니다.']}break}
  case'req-add':{const r=addReq({name:D('nr.name',''),text:D('nr.text',''),kind:D('nr.kind','포함'),reason:D('nr.reason',''),src:D('nr.src','')});report(r);if(r.ok)clearDraft(['nr.']);break}
  case'req-done':report(setReview(d.id,'done'));break;
  case'req-release':report(setReview(d.id,'release'));break;
  case'req-hold':report(setReview(d.id,'hold'));break;
  case'issue-resolve':{const r=resolveIssue(d.id,D('ie:'+d.id,''),D('ir:'+d.id,''));report(r);if(r.ok)clearDraft(['ie:'+d.id,'ir:'+d.id]);break}
  case'doc-apply':{const x=docOf(ui.tab);const r=applyDoc(x.id,{body:D('db:'+x.id,x.body),recipient:D('dr:'+x.id,x.recipient)});report(r);if(r.ok)clearDraft(['db:'+x.id,'dr:'+x.id]);break}
  case'doc-draft':{const x=docOf(ui.tab);if(x.body.trim()&&x.body!==norm(DEF.docs[DOCDEF(x.id).key])&&!draftBlockers().length&&!await ask('현재 편집본을 샘플 초안으로 교체합니다. 계속할까요?')){note('warn','교체를 취소했습니다. 본문·상태·버전은 그대로입니다.');break}const r=loadDraft(x.id);report(r);if(r.ok)clearDraft(['db:'+x.id,'dr:'+x.id]);break}
  case'doc-manual':report(manualDoc(ui.tab,'start'));break;
  case'doc-manual-done':report(manualDoc(ui.tab,'done'));break;
  case'doc-restore':{const x=docOf(ui.tab);if(x.snapshots.length&&!await ask('마지막 검토본의 본문을 새 현재 버전으로 복사합니다. 현재 본문은 이력에서 확인할 수 있습니다. 계속할까요?')){note('warn','복원을 취소했습니다.');break}const r=restoreLast(x.id);report(r);if(r.ok)clearDraft(['db:'+x.id,'dr:'+x.id]);break}
  case'doc-gen':{const x=docOf(ui.tab);const r=runGen(x.id,D('gen','성공'));report(r);break}
  case'doc-check':{const x=docOf(ui.tab);report(sourceCheck(x.id));break}
  case'impact-apply':{const r=applyImpact(d.id);report(r);if(r.ok)clearDraft(['db:'+d.id,'dr:'+d.id]);break}
  case'impact-all':{let n=0;const miss=[];S.docs.forEach(x=>{if(proposal(x)!==null){const r=applyImpact(x.id);if(r.ok){n++;clearDraft(['db:'+x.id,'dr:'+x.id])}else miss.push(x.label)}});report({ok:n>0,msg:n+'개 문서에 제안을 적용했습니다. 각 문서는 재검토 상태이며 자동 확정하지 않습니다.',items:miss});break}
  case'q-receive':report(receiveQ(d.id));break;
  case'q-classify':{const r=classifyQ(d.id,D('qc:'+d.id,''));report(r);if(r.ok)clearDraft(['qc:'+d.id]);break}
  case'doc-confirm':{const x=docOf(ui.tab);const r=confirmDoc(x.id);report(r);break}
  case'export':{const t=exportText();if(bytes(t)>MAX_BYTES){note('err','작업 파일이 2MB 한도를 넘어 내보내지 않았습니다. 이력은 삭제하지 않았습니다.');break}download('AX_시연작업_'+S.scenarioId+'.json',t);S.dirty=false;log('작업 파일 내보내기');note('','작업 파일 다운로드를 만들었습니다. 디스크 저장 완료는 브라우저가 처리합니다.');break}
  case'test-import':{if(!await confirmReplace('시험 파일을 불러오면 현재 작업이 교체될 수 있습니다. 검증에 실패하면 현재 작업은 유지됩니다.')){note('warn','불러오기를 취소했습니다.');break}const r=importText(testFile(D('tf','format')));if(r.ok)note('',r.msg);else note('err',r.msg);break}
 }
 render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&b.tagName==='BUTTON')handle(b.dataset.act,b.dataset)});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='scenario-select')handle('scenario',{value:t.value});else if(t.id==='import-file'){const f=t.files[0];t.value='';if(!f)return;f.text().then(async text=>{if(!await confirmReplace('작업 파일을 불러오면 현재 작업이 교체됩니다.')){note('warn','불러오기를 취소했습니다.');render();return}const r=importText(text);note(r.ok?'':'err',r.msg);render()})}
 else if(t.dataset&&t.dataset.draft){ui.draft[t.dataset.draft]=t.type==='checkbox'?t.checked:t.value}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.draft&&t.type!=='checkbox')ui.draft[t.dataset.draft]=t.value;else if(t.dataset&&t.dataset.model==='reviewer')S.reviewer=t.value;else if(t.dataset&&t.dataset.model==='caseTitle')S.caseTitle=t.value});
document.addEventListener('toggle',e=>{const k=e.target.dataset&&e.target.dataset.open;if(k)ui.open[k]=e.target.open},true);
window.addEventListener('beforeunload',e=>{if(S&&S.dirty){e.preventDefault();e.returnValue=''}});
$('#def-rev').textContent=DEF.rev;
$('#scenario-select').innerHTML=DEF.scenarios.map(x=>`<option value="${x.code}">${x.code} ${esc(x.name)}</option>`).join('');
startScenario('T-01');render();
window.AXDemo={getState:()=>S,ui,blockers,validateWork,importText,exportText,testFile,startScenario:c=>{startScenario(c);render()},render};
</script></body></html>
